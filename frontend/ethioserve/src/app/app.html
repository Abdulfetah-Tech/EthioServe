<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="EthioServe home">EthioServe</a>

    <button type="button" class="nav-toggle" (click)="toggleNav()" aria-label="Open menu" [attr.aria-expanded]="openNav()">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <nav [class.nav-open]="openNav()" aria-label="Main">
      <a routerLink="/providers" routerLinkActive="active">Find providers</a>
      @if (auth.isAuthenticated()) {
        <app-notification-bell />
        <a [routerLink]="home()" routerLinkActive="active">Dashboard</a>
        <span class="user-name">{{ auth.currentUser()?.displayName }}</span>
        <button type="button" class="btn btn-ghost" (click)="signOut()">Sign out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Sign in</a>
        <a routerLink="/register" class="btn btn-primary">Create account</a>
      }
    </nav>
  </div>
</header>

<main id="main" class="container">
  <router-outlet />
</main>

<footer class="site-footer container">
  <small>&copy; EthioServe. Find trusted professionals. Get the job done.</small>
</footer>
